<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Table Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- JOIN SCREEN -->
  <main id="join-screen" class="join-screen">
    <div class="join-card">
      <p class="eyebrow">A private room for your people</p>
      <h1 class="brand">Family Table</h1>
      <p class="tagline">No app to install. No one outside the family. Just a link and a passcode.</p>

      <form id="join-form">
        <label class="field-label" for="name-input">Your name</label>
        <input id="name-input" type="text" placeholder="e.g. Priya" maxlength="30" autocomplete="off" required />

        <label class="field-label" for="passcode-input">Family passcode</label>
        <input id="passcode-input" type="password" placeholder="Ask a family member" autocomplete="off" required />

        <button type="submit">Take a seat</button>
        <p id="join-error" class="join-error" role="alert"></p>
      </form>
    </div>
  </main>

  <!-- CHAT SCREEN -->
  <div id="chat-screen" class="chat-screen hidden">
    <aside class="rail">
      <div class="rail-header">
        <h2 id="family-title" class="family-title">Family Table</h2>
        <p class="rail-sub"><span id="online-count">0</span> at the table</p>
      </div>
      <div id="who-list" class="who-list"></div>
    </aside>

    <section class="chat-main">
      <header class="chat-header">
        <span id="chat-title">Family Table</span>
        <span id="typing-indicator" class="typing-indicator"></span>
        <div class="header-actions">
          <button id="notif-btn" type="button" class="icon-btn hidden" title="Enable notifications for @mentions">🔔</button>
          <div class="theme-picker">
            <button id="theme-btn" type="button" class="icon-btn" title="Change theme" aria-haspopup="true">🎨</button>
            <div id="theme-menu" class="theme-menu hidden">
              <button type="button" class="theme-option" data-theme="classic"><span class="swatch swatch-classic"></span>Classic</button>
              <button type="button" class="theme-option" data-theme="pink-heart"><span class="swatch swatch-pink-heart"></span>Pink Heart</button>
              <button type="button" class="theme-option" data-theme="blue-ocean"><span class="swatch swatch-blue-ocean"></span>Blue Ocean</button>
              <button type="button" class="theme-option" data-theme="pearl"><span class="swatch swatch-pearl"></span>Pearl</button>
              <button type="button" class="theme-option" data-theme="sunflower"><span class="swatch swatch-sunflower"></span>Sunflower</button>
            </div>
          </div>
        </div>
      </header>

      <div id="message-list" class="message-list"></div>

      <form id="message-form" class="message-form">
        <div class="emoji-wrap">
          <button id="emoji-btn" type="button" class="icon-btn" aria-label="Add emoji" aria-haspopup="true">😊</button>
          <div id="emoji-panel" class="emoji-panel hidden"></div>
        </div>
        <input id="message-input" type="text" placeholder="Say something to the table… (@name to tag someone)" autocomplete="off" maxlength="2000" />
        <button type="submit" aria-label="Send">Send</button>
      </form>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
